<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Chrome Fleet · 支持 Skill 接入的独立浏览器工作台</title>
  <desc id="desc">每个账号，一个独立的 Chrome 工作环境。通过 Skill 部署或接入 Chrome Fleet 服务，连接 Codex、Claude Code，用自然语言操作指定账号的浏览器，支持 MCP 自动化和人工接管。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFBFE"/>
      <stop offset="1" stop-color="#F0ECFC"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1438" height="418" rx="23"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1438" height="418" rx="23" fill="url(#background)" stroke="#E9E6F3" stroke-width="2"/>
  <g clip-path="url(#frame)">
